[package]
name = "aimer"
version = "26.0.0-dev.2"
edition = "2024"
rust-version = "1.99.1"
resolver = "3"
build = "build.rs"

[features]
# The default build includes the MCP server but does not bundle the
# proc-macro helper; opt in with `bundled-proc-macro`.
default = ["mcp"]
# The `aimer mcp` server and the embedded rust-analyzer IDE engine behind it.
mcp = [
  "dep:rmcp",
  "dep:unicode-ident",
  "dep:unicode-properties",
  "dep:ra_ap_ide",
  "dep:ra_ap_ide_db",
  "dep:ra_ap_hir",
  "dep:ra_ap_load_cargo",
  "dep:ra_ap_project_model",
  "dep:ra_ap_vfs",
  "dep:ra_ap_proc_macro_api",
]
# Bundle the matching Rust Analyzer proc-macro server in the Aimer executable.
bundled-proc-macro = ["mcp"]
# Expose the legacy LSP-shaped tool surface from the MCP server.
legacy-lsp = ["mcp"]


[[bin]]
name = "aimer"
path = "src/main.rs"

[lib]
name = "aimer_cli"
path = "src/lib.rs"

[dependencies]
aimer_config.workspace = true
aimer_prendre.workspace = true

# Non-local
ra_ap_ide = { package = "ide", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_ide_db = { package = "ide-db", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_hir = { package = "hir", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_load_cargo = { package = "load-cargo", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_project_model = { package = "project-model", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_vfs = { package = "vfs", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
ra_ap_proc_macro_api = { package = "proc-macro-api", git = "https://github.com/aimer-rs/aimer-rust-analyzer", branch = "release", optional = true }
# ra-ap-rustc_lexer requires these generated Unicode tables to use the same version.
unicode-ident = { version = "=1.0.24", optional = true }
unicode-properties = { version = "=0.1.4", optional = true }
unicode-width = "0.2.2"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "process",
  "io-util",
  "sync",
  "time",
] }
reqwest.workspace = true
flate2.workspace = true
zstd.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
dirs.workspace = true
uuid.workspace = true
sysinfo.workspace = true
rmcp = { workspace = true, optional = true }
ansi-to-tui.workspace = true
clap.workspace = true
crossterm.workspace = true
inquire.workspace = true
ratatui.workspace = true
arboard.workspace = true
colored.workspace = true
crossbeam.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
sha1.workspace = true
semver.workspace = true
hex.workspace = true
syn.workspace = true
quote.workspace = true
notify.workspace = true
proc-macro2.workspace = true
regex.workspace = true


[target.'cfg(unix)'.dependencies]
libc = "0.2"


[build-dependencies]
chrono.workspace = true


[workspace]
members = [".", "aimer_config"]


[workspace.dependencies]

aimer_config = { path = "aimer_config" }

# The client side of `aimer_prendre`: it sends synthetic input to a running app.
# It has no dependencies of its own with only the `client` feature.
# aimer_prendre = { path = "../aimer/host/prendre", default-features = false, features = ["client"] }

# Pin a commit instead once the crate is pushed; the path needs the aimer
# repository checked out next to this one.
aimer_prendre = { git = "https://github.com/aimer-rs/aimer.git", package = "aimer_prendre" ,rev = "616394c865c4010e8840e15e15b28fff32fca18b", default-features = false, features = ["client"] }

# Crates.io dependencies

chrono = "0.4.45"
crossbeam = "0.8.4"
tokio = "1.52.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "stream",
] }
flate2 = "1.1"
zstd = "0.13"
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.29.0", features = [
  "rustls-tls-native-roots",
] }
serde = { version = "1.0.228", features = ["default", "derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.5", features = ["js", "v4", "serde"] }
dirs = "6.0.0"
sysinfo = { version = "0.37.2", default-features = false, features = [
  "system",
] }
rmcp = { version = "3.2.0", features = ["transport-io"] }
colored = "3.1.1"
crossterm = "0.29.0"
clap = { version = "4.6.1", features = ["derive"] }
inquire = "0.9.4"
ratatui = "0.30.2"
ansi-to-tui = "8.0.1"
arboard = "3.6.1"
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
notify = "9.0.0-rc.4"
thiserror = "2.0.18"
anyhow = "1.0.103"
toml = "1.1.2+spec-1.1.0"
toml_edit = { version = "0.25.15", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
sha2 = "0.11.0"
sha1 = "0.10.7"
semver = "1"
hex = "0.4.3"
ring = "0.17.14"
subtle = "2.6.1"
syn = { version = "2.0.118", features = ["full", "visit", "visit-mut"] }
quote = "1.0.47"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
regex = "1.13.1"
